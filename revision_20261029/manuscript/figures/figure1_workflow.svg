   <g id="text_1">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(32.38102 59.74901)">Sensor observations</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(30.152895 69.49926)">Independent daily QC</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(27.04727 79.23301)">30-day sensor windows</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(159.728465 59.911635)">Calibration pipelines</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(159.839715 69.518385)">+ allowed prior audit</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(161.060965 79.261635)">Candidate products</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(279.752785 59.86476)">Frozen conformity score</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(274.400285 69.70176)">Sensor and output features</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(277.079035 79.30851)">No assessment reference</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(408.64523 59.765635)">Rank the review queue</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(415.98648 69.515885)">One-product policy</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(415.094605 79.216385)">reported separately</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(159.51034 193.874035)">Prior reference audit</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(158.728465 203.514035)">B = 0, 1, 3, or 7 days</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(161.51159 213.214535)">Before assessment</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(282.85966 193.82716)">Assessment reference</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(281.96341 203.46716)">At least 23 paired days</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(277.286535 213.16766)">Label and evaluation only</text>
   </g>
   <g id="text_7">
